# modernz OSC 参数
#
# 这里只写偏离默认值的项，完整可调项见 scripts/modernz.lua 顶部的 user_opts 表。
#
# 重要：mpv 的 Lua 选项解析器（player/lua/options.lua:67）只把「行首 #」当注释，
# 行尾的 # 会被原样并进选项值。number / boolean 转换失败就报错并回退默认值，
# string 则直接吃下带着注释的脏字符串。
# 所以本文件所有注释必须独占一行，不能写在 = 后面。

# OSC 无鼠标操作后自动隐藏的延迟，单位毫秒（默认 1500）
hidetimeout=2000

# 在 OSC 上显示截图按钮（默认 false）
screenshot_button=yes
