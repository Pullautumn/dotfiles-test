# ============================================================
# mpv 主配置
#
# 关于注释：mpv.conf 由 C 解析器（options/parse_configfile.c）读取，
# 行尾的 # 会被正确切掉，写在行尾也安全。
# 但 script-opts/*.conf 由 Lua 解析器读取，只认行首 #（见 README）。
# 本仓库统一把注释写成独立行，两边都不会踩坑。
# ============================================================

# ---------- 画面 ----------
profile=gpu-hq

# 输出后端：gpu-next 是 libplacebo 管线，画质上限更高（HDR 色调映射、
# film grain 合成、更新的缩放器），真显卡下首选。
# 注意：libplacebo 检测到 OpenGL 是软件光栅化（llvmpipe）时会以
# allow_software=false 直接拒绝初始化——也就是说在没开 3D 加速的
# virtio-gpu 虚拟机里跑 mpv 会报 "Failed initializing opengl context" / no video。
# 只在虚拟机里临时验证画面时，把下行临时改成 vo=gpu（老管线，软件渲染只
# 警告不拒绝）并注释掉插值三行；测完改回来，物理机上不要留这个值。
vo=gpu-next
gpu-api=auto
gpu-context=wayland
dither-depth=auto

# 硬解：auto-copy 是 copy-back 模式，兼容性最好（NVIDIA 也能用），
# 并且内存里会保留 CPU 侧帧，将来接 SVP 补帧不用改。
# 只装 AMD / Intel 且追求极致性能可以换 vaapi（zero-copy）；
# NVIDIA 用户如果 auto-copy 有问题，改 nvdec-copy。
hwdec=auto-copy
hwdec-codecs=all

# 帧插值：把片源帧率补到屏幕刷新率，必须配合 display-resample 才有意义。
# tscale=mitchell 指定插值核；默认的 oversample 在插值场景下质量偏低。
# 不想要「肥皂剧效应」或者 GPU 吃紧，把下面三行一起注释掉。
video-sync=display-resample
interpolation
tscale=mitchell

# ---------- 播放行为 ----------
# 播完停在最后一帧，不自动关窗
keep-open=always

# 断点续播：mpv 默认是关的（--save-position-on-quit 默认 no）。
# 追剧想要就取消下面这行的注释。
# 如果你用 SVP 补帧，SVP 与续播有冲突，保持注释。
# save-position-on-quit=yes

# ---------- 音频 ----------
audio-file-auto=fuzzy
# 强制双声道输出。有 5.1 / 7.1 音箱就把这行注释掉。
audio-channels=stereo
audio-normalize-downmix=yes
volume=100
volume-max=200

# ---------- 字幕 ----------
sub-auto=fuzzy
# 音轨优先级：日语 > 英语 > 中文
alang=ja,en,zh
# 字幕优先级：中文 > 英语 > 日语
slang=zh,en,ja

# 下面这组只对 SRT / VTT 这类纯文本字幕生效，
# ASS 字幕默认保留内嵌样式（想强制覆盖需要 sub-ass-override）。
# sub-font 依赖 noto-fonts-cjk，已在 PKG_GROUPS[fonts] 里。
sub-font='Noto Sans CJK SC'
sub-font-size=48
sub-color='#FFFFFF'
sub-border-size=3
sub-border-color='#000000'
sub-shadow-offset=1
sub-shadow-color='#000000'

# 次字幕（主字幕 + 次字幕同时显示），需要 mpv >= 0.40
secondary-sid=auto
secondary-sub-pos=95
secondary-sub-visibility=yes

# ---------- 界面 ----------
# 关掉内置 OSC，界面交给 scripts/modernz.lua
osc=no
osd-bar=no
border=no
# 窗口最大占屏幕 80%，不铺满
autofit-larger=80%x80%

# ---------- Anime4K ----------
# 着色器不在仓库里。install.sh 会询问是否下载到 ~/.config/mpv/shaders/。
# 默认不启用，播放中用 Ctrl+1..6 切换模式，Ctrl+0 清除。
# 想启动就自动启用，取消下面这行的注释（~~ 指 ~/.config/mpv）。
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
